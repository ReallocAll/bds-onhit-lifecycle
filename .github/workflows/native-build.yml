name: OnHitFix Linux build
on:
  push:
    branches: [feat/identity-and-diagnostic-scaffold]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Endstone toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 libc++-18-dev libc++abi-18-dev ninja-build libssl-dev
      - name: Build Linux preview plugin
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_FLAGS=-stdlib=libc++ -DONHIT_BUILD_PLUGIN=ON -DONHIT_BUILD_TESTS=ON
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          test -s build/endstone_onhitfix.so
          file build/endstone_onhitfix.so
      - uses: actions/upload-artifact@v4
        with:
          name: onhitfix-linux-x86_64
          path: build/endstone_onhitfix.so
          if-no-files-found: error
